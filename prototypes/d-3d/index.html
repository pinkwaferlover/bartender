<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dionysus 3D Bar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap">
<style>
/* Prototype D: a real 3D hotel bar. Throwaway. Page and bar are dark by design (the brief fixes the palette). */
:root{
  color-scheme:dark;
  --page:#0f0e10; --ink:#f0e7d8; --mute:#a39a8d; --faint:#2b272c; --panel:#18151a; --line:#3a343b;
  --acc:#e2ae5c; --neon:#ff5a78; --green:#2f5a3f; --leaf:#5aa25a;
  --rich:#d99a2b; --fresh:#7fbf4a; --bitter:#d0453a; --boozy:#c2702a;
  --display:"Marcellus",Georgia,serif; --body:"Inter",system-ui,sans-serif;
  --e:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font:15px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter .9s var(--e)}
body.dof #c{filter:blur(3.2px) saturate(.9) brightness(.82)}
#fade{position:fixed;inset:0;background:var(--page);pointer-events:none;opacity:1;transition:opacity 1s}
#title{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:italic 600 min(17vw,190px)/1 Georgia,serif;letter-spacing:.06em;color:var(--ink);opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 0 40px #ff5a7844;will-change:transform,opacity}
.hud{position:fixed;top:max(14px,env(safe-area-inset-top));display:flex;gap:10px;z-index:20}
#hudR{right:16px}#hudL{left:16px}
.pill{height:44px;min-width:44px;padding:0 14px;border-radius:999px;background:#15121799;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #ffffff1a;display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.pill svg{width:20px;height:20px}
.hidden{display:none!important}
.fadein{animation:fi .5s var(--e) both}@keyframes fi{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}

/* speech bubble */
#bubble{position:fixed;left:0;top:0;width:350px;max-width:calc(100vw - 32px);background:#f3ebdd;color:#1d1714;border-radius:22px;padding:16px 16px 12px;box-shadow:0 18px 50px #000a;z-index:15;transform-origin:0 50%}
#bubble::before{content:"";position:absolute;left:-12px;top:var(--ty,40%);border:9px solid transparent;border-right:14px solid #f3ebdd;border-left:0}
#bubble.tailtop::before{left:var(--tx,40px);top:-14px;border:9px solid transparent;border-bottom:14px solid #f3ebdd;border-top:0}
#bubble .who{font:12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#7c6a5a;margin-bottom:6px}
#btext{font:19px/1.35 var(--display);min-height:1.35em}
#btext small{display:block;font:13px/1.45 var(--body);color:#5a4c40;margin-top:6px}
#btext .tell{font:15px/1.5 var(--body);color:#2a221d;margin-top:8px;max-height:38vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{min-height:36px;padding:6px 12px;border-radius:999px;background:#e5dac7;color:#2a211b;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#2a211b;color:#f3ebdd}
.chip.skip{background:none;border:1px dashed #a8988a;color:#6e5f52}
.chip.dk{background:#fff;border:1px solid #d8ccb8}
.chip .dot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px #0002}
.chip .miss{font-size:11px;color:#9a5a3a}
.askrow{display:flex;gap:6px;margin-top:12px;align-items:center}
.askrow input{flex:1;min-width:0;height:44px;border-radius:999px;border:1px solid #d2c4af;background:#fffaf2;padding:0 16px;color:#1d1714;font-size:15px}
.askrow input::placeholder{color:#8f7f70}
.round{width:44px;height:44px;border-radius:50%;background:#2a211b;color:#f3ebdd;display:grid;place-items:center;flex:none}
.round.mic{background:#e5dac7;color:#2a211b}
.round.mic.listen{background:var(--neon);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ff5a7833}}
.round svg{width:20px;height:20px}

/* bar hints */
#hints{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;z-index:12;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}
#hints .pill{font-size:13px}

/* sheets / panels */
.sheet{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px #000c;color:var(--ink)}
.sheet h2{font:26px/1.15 var(--display);margin:0 0 6px;font-weight:400}
.sheet .sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.btn{height:46px;padding:0 20px;border-radius:999px;background:var(--ink);color:#151215;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

#stock{left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;padding:22px}
.vf{position:relative;height:250px;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#3a2c22,#120e0c);margin-bottom:14px}
.vf .b{position:absolute;bottom:22%;border-radius:6px 6px 3px 3px}
.vf .frame{position:absolute;inset:16px;border:2px solid #ffffff55;border-radius:10px}
.vf .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.vf .flash.go{animation:flash .35s}@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.vf .count{position:absolute;right:14px;top:12px;font-size:13px;background:#0008;padding:4px 10px;border-radius:999px}
.shutter{width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px #ffffff33;margin:0 auto;display:block}
.bar{height:6px;border-radius:9px;background:var(--faint);overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width 1.4s linear}
.ticks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:6px 0 16px}
.tick{display:flex;gap:10px;align-items:center;min-height:44px;padding:6px 12px;border-radius:12px;background:#221e24;cursor:pointer;font-size:14px}
.tick input{width:20px;height:20px;accent-color:var(--acc)}
.found{columns:2;column-gap:18px;font-size:14px;margin:4px 0 16px}.found div{break-inside:avoid;padding:2px 0;color:#d8cfc2}.found b{display:block;font-weight:600;color:var(--acc);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.paste{font-size:13px;color:var(--mute);margin-top:12px}.paste a{color:var(--acc)}

/* menu: the leather menu, seen up close */
#menu{left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 24px));height:min(700px,calc(100vh - 90px));display:flex;flex-direction:column;background:linear-gradient(160deg,#21503a,#163a2a 60%,#11301f);border:0;border-radius:10px;box-shadow:0 0 0 2px #c9a35a inset,0 0 0 8px #163a2a inset,0 0 0 9px #c9a35a88 inset,0 40px 90px #000d;padding:26px 26px 18px;color:#f1e6c8}
#menu h2{text-align:center;font-size:30px;letter-spacing:.3em;color:#e6c27a;margin:4px 0 12px}
.tabs{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.tab{height:40px;padding:0 16px;border-radius:999px;border:1px solid #c9a35a77;color:#e6d3a4;font-size:14px}
.tab[aria-selected="true"]{background:#e6c27a;color:#1a2e22;border-color:#e6c27a}
#mlist{overflow:auto;flex:1;padding-right:4px}
.grp{margin:4px 0 14px}.grp h3{font:15px/1.2 var(--display);letter-spacing:.18em;text-transform:uppercase;color:#e6c27a;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.grp h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.drink{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:9px 6px;border-bottom:1px dotted #c9a35a44;font:17px/1.25 var(--display);color:#f6ecd2;min-height:44px;align-items:center}
.drink span{font:12px/1.3 var(--body);color:#c6b58e;text-align:right}
.drink.cant{color:#b9b096}.drink .m{color:#e2a07a}
.az{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}.az button{width:34px;height:34px;border-radius:8px;font:16px var(--display);color:#e6d3a4}.az button:disabled{opacity:.3}

/* recipe card in the foreground */
#recipe{left:max(16px,4vw);top:50%;transform:translateY(-50%);width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;padding:24px 24px 18px;background:#f3ebddf2;color:#1f1915;border:0}
#recipe h2{font-size:34px;color:#1f1915}
#recipe .sub{color:#6a5a4c}
#recipe h4{font:12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#8a7766;margin:16px 0 6px}
.ing{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #d9ccb8;font-size:15px}
.ing em{font-style:normal;color:#8a7766;font-size:13px}.ing.miss{color:#a3502f}.ing .sw{color:#6b7f3a;font-size:13px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;padding:7px 8px;border-radius:10px;font-size:15px;transition:background .3s}
.steps li::before{content:counter(s);font:600 13px/22px var(--body);width:22px;height:22px;border-radius:50%;background:#e2d6c2;text-align:center;flex:none}
.steps li.now{background:#2a211b;color:#f3ebdd}.steps li.now::before{background:var(--acc);color:#2a211b}
.steps li .tool{display:block;font-size:12px;color:#8a7766;margin-top:2px;font-style:italic}.steps li.now .tool{color:#e2c79a}
.swap{background:#e7dcc6;border-radius:12px;padding:8px 12px;font-size:13px;margin-top:10px;color:#4b3c30}
#recipe .row{margin-top:14px}
#recipe .btn{background:#2a211b;color:#f3ebdd}#recipe .btn.ghost{background:none;color:#2a211b;border-color:#cdbfa9}
.story{font-size:14px;color:#4b3c30;margin-top:10px;font-style:italic}

#shelfp{right:max(16px,3vw);top:50%;transform:translateY(-50%);width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 110px);overflow:auto;padding:22px}
#shelfp .fam{margin:10px 0}#shelfp .fam b{font:12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
#shelfp .fam div{font-size:14px;color:#d9d0c3;padding:3px 0}

#settings{right:16px;top:70px;width:min(340px,calc(100vw - 32px));padding:18px;z-index:40}
#settings h3{font:12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:12px 0 8px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{min-height:40px;padding:6px 12px;border-radius:999px;background:#241f26;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#151215}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.adult{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:#5a1f2a;color:#ffd4dc;margin-left:4px}
.toggle{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute);margin-top:10px;min-height:40px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--neon)}

#toast{position:fixed;left:50%;top:max(70px,9vh);transform:translateX(-50%);background:#f3ebdd;color:#1d1714;padding:10px 18px;border-radius:999px;font:17px var(--display);z-index:35;box-shadow:0 10px 30px #0009;pointer-events:none}

/* phone: cropped taller view, bubble and cards become bottom sheets */
@media (max-width:640px){
  #bubble{left:16px!important;right:16px;width:auto!important;top:auto!important;bottom:max(14px,env(safe-area-inset-bottom));max-width:none}
  #bubble::before{left:var(--tx,50%)!important;top:-14px!important;border:9px solid transparent!important;border-bottom:14px solid #f3ebdd!important;border-top:0!important}
  #btext{font-size:17px}
  #hints{bottom:auto;top:66px}
  #recipe{left:12px;right:12px;width:auto;top:auto;bottom:12px;transform:none;max-height:62vh;padding:18px}
  #recipe h2{font-size:28px}
  #shelfp{left:12px;right:12px;width:auto;top:auto;bottom:12px;transform:none;max-height:60vh}
  #menu{height:calc(100vh - 84px);top:calc(50% + 26px);padding:20px 16px 12px}
  #menu h2{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="A hotel bar in 3D. Dionysus stands behind the counter."></canvas>
<div id="fade"></div>
<div id="title" aria-hidden="true">DIONYSUS</div>

<div id="hudL" class="hud"><button id="back" class="pill hidden" aria-label="Back to the bar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>The bar</button></div>
<div id="hudR" class="hud"><button id="gear" class="pill" aria-label="Look settings" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Look</button></div>

<div id="bubble" class="hidden" role="dialog" aria-live="polite" aria-label="Dionysus">
  <div class="who">Dionysus</div>
  <div id="btext"></div>
  <div id="bchips" class="chips"></div>
  <form id="ask" class="askrow" autocomplete="off">
    <input id="q" type="text" placeholder="Tell me what you fancy…" aria-label="Talk to Dionysus">
    <button type="button" id="mic" class="round mic" aria-label="Speak to him"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button type="submit" class="round" aria-label="Say it"><svg viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </form>
</div>

<div id="hints" class="hidden"></div>
<div id="toast" class="hidden"></div>

<section id="stock" class="sheet hidden" aria-label="Stock your shelf"></section>
<section id="menu" class="sheet hidden" aria-label="The menu">
  <h2>MENU</h2>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="spirit" aria-selected="true">By spirit</button>
    <button class="tab" role="tab" data-t="feel" aria-selected="false">By feel</button>
    <button class="tab" role="tab" data-t="az" aria-selected="false">A–Z</button>
  </div>
  <div id="mlist"></div>
</section>
<section id="recipe" class="sheet hidden" aria-label="Recipe"></section>
<section id="shelfp" class="sheet hidden" aria-label="Your shelf"></section>
<section id="settings" class="sheet hidden" aria-label="Look">
  <h2 style="font-size:22px">His look</h2>
  <h3>Finish</h3>
  <div class="seg" id="sFinish">
    <button data-v="painted" aria-pressed="true">Painted marble</button>
    <button data-v="white" aria-pressed="false">White marble</button>
    <button data-v="living" aria-pressed="false">Living</button>
  </div>
  <h3>Coverage</h3>
  <div class="seg" id="sCover">
    <button data-v="classical" aria-pressed="true">Classical</button>
    <button data-v="modest" aria-pressed="false">Modest</button>
    <button data-v="cheeky" aria-pressed="false" disabled>Cheeky<span class="adult">Adult</span></button>
  </div>
  <label class="toggle"><input type="checkbox" id="sAdult"> I'm an adult: allow the cheeky option. Off until you switch it on, and only ever implied.</label>
</section>

<script src="../../src/data.js"></script>
<script src="../../src/stories.js"></script>
<script type="importmap">{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
const V3=THREE.Vector3, $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{const v=localStorage.getItem('d3d.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('d3d.'+k,JSON.stringify(v))}catch{}}};

/* ───────── data: the 34 recipes from src/data.js, read through the brief's words ───────── */
const FEEL4={rich:['Sweet and rich','#d99a2b'],fresh:['Sharp and fresh','#7fbf4a'],bitter:['Bitter','#d0453a'],boozy:['Dry and boozy','#c2702a']};
const feel4=r=>({sweet:'rich',decadent:'rich',fresh:'fresh',balanced:'fresh',bitter:'bitter',strong:'boozy'})[r.feel];
const MOMENT={before:'Before dinner',food:'With food',after:'After dinner',any:'Just because'};
const moments=r=>{const m=new Set(['any']),t=r.tags;if(r.feel==='bitter'||/dry|aperitif|low/.test(t)||['martini','americano','oldpal'].includes(r.id))m.add('before');
  if(r.feel==='decadent'||/after dinner|coffee|almond|nutty|cream|hot|warm/.test(t)||['bloodandsand','sidecar','oldfashioned','manhattan','robroy'].includes(r.id))m.add('after');
  if(r.feel==='fresh'&&(r.glass==='highball'||/long/.test(t))||['daiquiri','margarita','paloma','gimlet'].includes(r.id))m.add('food');return m};
const ABV={spirit:.4,liqueur:.25,wine:.16};
const strength=r=>{let p=0;for(const g of r.ing){const k=(ING[g.k]||[])[1];if(ABV[k]&&/ml/.test(g.u))p+=g.q*ABV[k]}return p<=13?'low':(p>=22||r.feel==='strong')?'strong':'regular'};
const STRENGTH={none:'None',low:'Low',regular:'Regular',strong:'Strong'};
const warm=r=>/hot|warm/.test(r.tags)||(r.season.includes('winter')&&['strong','decadent','sweet'].includes(r.feel));
const SP_NAMES={whisky:'Whisky',gin:'Gin',rum:'Rum',tequila:'Tequila',vodka:'Vodka',brandy:'Brandy',aperitif:'Aperitifs'};
R.forEach(r=>{r.f4=feel4(r);r.mom=moments(r);r.str=strength(r)});
const SHELF_KIND=new Set(['spirit','liqueur','wine','bitters','sweet','mixer']);
const FAMILY=k=>{const[ ,kind,,shape]=ING[k]||[];if(kind==='spirit')return({whisky:'Whisky',gin:'Gin',rum:'Rum',tequila:'Tequila',vodka:'Vodka',brandy:'Brandy'})[shape]||'Spirits';
  return({liqueur:'Liqueurs',wine:'Vermouth and wine',bitters:'Bitters',sweet:'Sweeteners',mixer:'Mixers',fruit:'Fresh',herb:'Fresh',other:'Pantry'})[kind]||'Pantry'};
const FAM_ORDER=['Whisky','Gin','Vodka','Rum','Tequila','Brandy','Vermouth and wine','Liqueurs','Bitters','Sweeteners','Mixers','Fresh','Pantry'];
const BARWARE=[['shaker','Shaker tin'],['strainer','Strainer'],['mixglass','Mixing glass'],['spoon','Bar spoon'],['jigger','Jigger'],['muddler','Muddler'],['juicer','Citrus press'],['rocks','Rocks glasses'],['coupe','Coupes'],['highball','Tall glasses'],['martini','Martini glasses'],['mug','Mugs']];
const SWAP={shaker:'No shaker tin? A jam jar with a tight lid works.',muddler:'No muddler? Use the end of a rolling pin.',mixglass:'No mixing glass? Stir in a jug.',spoon:'No bar spoon? A chopstick stirs fine.',strainer:'No strainer? Hold back the ice with a small sieve.',jigger:'No jigger? A tablespoon is 15 ml.',juicer:'No citrus press? Squeeze by hand over a fork.'};
const needs=r=>{const s=new Set(['jigger']);for(const[a,,t]of r.steps){if(a==='shake')s.add('shaker');if(a==='strain')s.add('strainer');if(a==='stir'||a==='float')s.add('spoon');if(a==='muddle')s.add('muddler');if(/mixing glass/.test(t))s.add('mixglass')}
  if(r.ing.some(g=>/juice/.test(g.u)))s.add('juicer');s.add(r.glass==='mug'?'mug':r.glass);return s};

const S={view:'intro',inv:new Set(['angostura bitters','blended scotch','soda water']),bar:new Set(),stocked:false,
  finish:store.get('finish','painted'),cover:store.get('cover','classical'),adult:store.get('adult',false),rid:null,tab:'spirit',talk:null};
if(S.cover==='cheeky'&&!S.adult)S.cover='classical';
const have=k=>STAPLE.has(k)||S.inv.has(k);
function stat(r){const miss=[],subs=[];for(const g of r.ing){if(have(g.k))continue;const s=g.subs.find(have);if(s){subs.push([g.k,s]);continue}if(g.o)continue;miss.push(g.k)}return{miss,subs,can:!miss.length}}

/* ───────── search: talking to him ───────── */
const Q_ORDER=['spirit','feel','moment','strength'];
function parse(text){const t=' '+text.toLowerCase()+' ',a={};
  for(const[w,s]of[['whisk','whisky'],['scotch','whisky'],['bourbon','whisky'],['rye','whisky'],['gin','gin'],['rum','rum'],['tequila','tequila'],['vodka','vodka'],['brandy','brandy'],['cognac','brandy'],['campari','aperitif'],['vermouth','aperitif'],['aperitif','aperitif']])if(t.includes(w)){a.spirit=s;break}
  if(/sweet|rich|honey|dessert|indulg/.test(t))a.feel='rich';else if(/sharp|fresh|sour|citrus|zest|tart|light/.test(t))a.feel='fresh';else if(/bitter/.test(t))a.feel='bitter';else if(/dry|boozy|stirred|spirit/.test(t))a.feel='boozy';
  if(/after dinner|nightcap|dessert|late/.test(t))a.moment='after';else if(/before dinner|aperitivo|aperitif|pre-dinner/.test(t))a.moment='before';else if(/with food|dinner|lunch|food/.test(t))a.moment='food';
  if(/no alcohol|alcohol-free|alcohol free|mocktail|sober|zero/.test(t))a.strength='none';else if(/\blow\b|light|weak|easy/.test(t))a.strength='low';else if(/strong|stiff|big/.test(t))a.strength='strong';
  if(/warm|hot|cold night|cosy|cozy|chilly|winter/.test(t))a.warm=1;
  const hit=R.find(r=>t.includes(r.name.toLowerCase()));if(hit)a.name=hit.id;return a}
function candidates(a){return R.filter(r=>(!a.spirit||r.spirit===a.spirit)&&(!a.feel||r.f4===a.feel)&&(!a.moment||a.moment==='any'||r.mom.has(a.moment))&&(!a.strength||r.str===a.strength)&&(!a.warm||warm(r)))
  .sort((x,y)=>stat(y).can-stat(x).can||x.name.localeCompare(y.name))}
const OPTS={spirit:Object.keys(SP_NAMES),feel:Object.keys(FEEL4),moment:['before','food','after','any'],strength:['none','low','regular','strong']};
const QTEXT={spirit:'Which spirit are you in the mood for?',feel:'And the feel? Sweet and rich, sharp and fresh, bitter, or dry and boozy?',moment:'When is it for?',strength:'How strong?'};
const optLabel=(q,v)=>q==='spirit'?SP_NAMES[v]:q==='feel'?FEEL4[v][0]:q==='moment'?MOMENT[v]:STRENGTH[v];
function startTalk(seedText){S.talk={a:{},asked:new Set(),n:0};if(curView!=='talk')goView('talk');if(seedText)hear(seedText);else ask()}
function hear(text){const a=parse(text);if(a.name){const r=RB[a.name];say(`A ${esc(r.name)}. Good choice. Coming up.`,{input:false});setTimeout(()=>openRecipe(r.id),900);return}
  Object.assign(S.talk.a,a);for(const k of Object.keys(a))S.talk.asked.add(k);ask()}
function ask(){const T=S.talk;let c=candidates(T.a);
  if(T.a.strength==='none'){say(`Nothing alcohol-free on my shelf yet.<small>That's coming (issue #5). Shall I make something low instead?</small>`,{plain:"Nothing alcohol-free on my shelf yet.",chips:[{t:'Something low',on:()=>{T.a.strength='low';ask()}},{t:'Start again',cls:'skip',on:()=>startTalk()}]});return}
  if(!c.length){const last=[...T.asked].pop();if(last&&last!=='warm'){delete T.a[last];say(`Nothing on my shelf fits all of that. Let me loosen the ${last}.`,{input:false,chips:[]});setTimeout(ask,1300);return}}
  const done=T.n>0&&c.length<=5||c.length<=5&&Object.keys(T.a).length>0;
  const next=Q_ORDER.find(q=>!T.asked.has(q));
  if(done||!next){showFits(c);return}
  const opts=OPTS[next].filter(v=>v==='any'||v==='none'||candidates({...T.a,[next]:v}).length);
  const lead=T.n===0&&Object.keys(T.a).length?(T.a.warm?'Something to warm you. ':'Got it. '):'';
  say(lead+QTEXT[next],{plain:lead+QTEXT[next],chips:[...opts.map(v=>({t:optLabel(next,v),html:next==='feel'?`<i class="dot" style="background:${FEEL4[v][1]}"></i>${esc(optLabel(next,v))}`:null,on:()=>{T.a[next]=v;T.asked.add(next);T.n++;ask()}})),{t:'Skip',cls:'skip',on:()=>{T.asked.add(next);T.n++;ask()}}]})}
function showFits(c){const list=c.slice(0,5);
  say(list.length?(list.length===1?'Just the one. This:':`A handful that fit. Pick one and I'll make it.`):'Hm. Let me start you somewhere else.',{plain:false,chips:[...list.map(r=>{const st=stat(r);return{cls:'dk',html:`<i class="dot" style="background:${r.colour}"></i>${esc(r.name)}${st.can?'':` <span class="miss">needs ${esc(lbl(st.miss[0]))}</span>`}`,on:()=>openRecipe(r.id)}}),{t:'Ask again',cls:'skip',on:()=>startTalk()}]})}

const clock=new THREE.Clock();let T0=0;
function frame(){const raw=Math.min(clock.getDelta(),.5),dt=Math.min(raw,.05),rt=Math.min(raw,.25);T0+=rt;const t=T0;
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=raw;if(w.t<0)continue;const p=Math.min(1,w.t/w.dur);w.fn(w.ease(p));if(p>=1){tweens.splice(i,1);w.res()}}
  // Dionysus: the liveliest thing in the room
  breath+=dt;torso.scale.set(1,1+Math.sin(breath*1.6)*.006*AMP,1);torso.rotation.z=Math.sin(t*.5)*.025*AMP;torso.rotation.y=Math.sin(t*.37)*.06*AMP;
  if(perf)perfTick(rt,t);else idle(t);
