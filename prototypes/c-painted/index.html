<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dionysus · Painted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="fin-painted cov-classical">
<div id="stage" aria-label="Dionysus behind his bar, painted">
 <div id="fit"><div id="cam">
  <canvas id="wall" class="layer"></canvas>
  <div id="sign" class="layer" aria-label="DIONYSUS"><span>DIONYSUS</span></div>
  <canvas id="shelf" class="layer touch" tabindex="0" role="button" aria-label="Your shelf"></canvas>
  <canvas id="dio" class="layer touch" tabindex="0" role="button" aria-label="Dionysus. Tap for a story"></canvas>
  <canvas id="counter" class="layer"></canvas>
  <canvas id="menu" class="layer touch" tabindex="0" role="button" aria-label="The cocktail menu"></canvas>
  <canvas id="panther" class="layer touch" tabindex="0" role="button" aria-label="The panther. Barman's choice"></canvas>
  <div id="dice" class="layer touch" aria-hidden="true"><div class="cube"><i class="f1"></i><i class="f2"></i><i class="f3"></i><i class="f4"></i><i class="f5"></i><i class="f6"></i></div></div>
  <canvas id="amph" class="layer"></canvas>
 </div></div>
 <div id="grain"></div><div id="vignette"></div>
</div>
<div id="word" aria-hidden="true">DIONYSUS</div>

<button id="gear" class="hud" aria-label="His look"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 5.5v3M12 15.5v3M5.5 12h3M15.5 12h3" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg></button>
<button id="back" class="hud" aria-label="Back to the bar" hidden>‹ The bar</button>
<button id="talkBtn" class="hud talk-cta" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h16v10H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg> Speak to Dionysus</button>

<div id="bubble" class="bubble" hidden aria-live="polite">
 <p id="say"></p>
 <div id="chips" class="chips"></div>
 <form id="talk" class="talk" hidden>
  <input id="talkIn" type="text" placeholder="Tell him what you fancy…" autocomplete="off" aria-label="Tell Dionysus what you fancy">
  <button type="button" id="mic" class="mic" aria-label="Speak to him"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
  <button type="submit" class="send" aria-label="Ask">→</button>
 </form>
 <button id="bubbleX" class="x" aria-label="Close">×</button>
</div>
<section id="panel" class="panel" hidden></section>
<section id="settings" class="settings" hidden aria-label="His look"></section>

<script src="data.js"></script>
<script src="stories.js"></script>
<script src="draw.js"></script>
<script src="inventory.js"></script>
<script src="logic.js"></script>
<script src="paint.js"></script>
<script src="app.js"></script>
</body>
</html>
